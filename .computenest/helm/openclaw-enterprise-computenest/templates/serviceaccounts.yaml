apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "oce.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerConfigJson | quote }}
{{ range $name := list "api" "worker" "endpoint" "bootstrap" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-{{ $name }}
  labels:
    {{- include "oce.labels" $ | nindent 4 }}
automountServiceAccountToken: {{ ternary true false (or (eq $name "api") (eq $name "worker") (eq $name "endpoint") (eq $name "bootstrap")) }}
imagePullSecrets:
  - name: {{ $.Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-enterprise-registry-sync
  labels:
    {{- include "oce.labels" . | nindent 4 }}
data:
  registry-sync.mjs: |
    import { readFile } from "node:fs/promises";

    const host = process.env.KUBERNETES_SERVICE_HOST;
    const port = process.env.KUBERNETES_SERVICE_PORT_HTTPS ?? "443";
    const sourceNamespace = process.env.SOURCE_NAMESPACE;
    const secretName = process.env.IMAGE_PULL_SECRET;
    const token = (await readFile("/var/run/secrets/kubernetes.io/serviceaccount/token", "utf8")).trim();
    const base = `https://${host}:${port}`;
    const headers = { Authorization: `Bearer ${token}` };
    const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

    async function request(path, options = {}) {
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...headers, ...(options.headers ?? {}) },
      });
      const text = await response.text();
      if (!response.ok) {
        const error = new Error(`Kubernetes API ${options.method ?? "GET"} ${path} returned ${response.status}: ${text}`);
        error.status = response.status;
        throw error;
      }
      return text.length === 0 ? undefined : JSON.parse(text);
    }

    async function optional(path) {
      try {
        return await request(path);
      } catch (error) {
        if (error.status === 404) return undefined;
        throw error;
      }
    }

    async function ensureSecret(namespace, source) {
      const path = `/api/v1/namespaces/${encodeURIComponent(namespace)}/secrets/${encodeURIComponent(secretName)}`;
      const existing = await optional(path);
      if (existing?.data?.[".dockerconfigjson"] === source.data[".dockerconfigjson"]) return;
      const body = {
        apiVersion: "v1",
        kind: "Secret",
        metadata: { name: secretName, namespace },
        type: "kubernetes.io/dockerconfigjson",
        data: { ".dockerconfigjson": source.data[".dockerconfigjson"] },
      };
      if (existing === undefined) {
        await request(`/api/v1/namespaces/${encodeURIComponent(namespace)}/secrets`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      } else {
        await request(path, {
          method: "PATCH",
          headers: { "Content-Type": "application/merge-patch+json" },
          body: JSON.stringify({ type: body.type, data: body.data }),
        });
      }
    }

    async function ensureImagePullSecret(path, current) {
      const names = (current ?? []).map((entry) => entry?.name).filter(Boolean);
      if (names.includes(secretName)) return;
      await request(path, {
        method: "PATCH",
        headers: { "Content-Type": "application/merge-patch+json" },
        body: JSON.stringify({ imagePullSecrets: [...names.map((name) => ({ name })), { name: secretName }] }),
      });
    }

    async function synchronize() {
      const source = await request(`/api/v1/namespaces/${encodeURIComponent(sourceNamespace)}/secrets/${encodeURIComponent(secretName)}`);
      const selector = encodeURIComponent("app.kubernetes.io/managed-by=openclaw-enterprise");
      const namespaces = await request(`/api/v1/namespaces?labelSelector=${selector}`);
      for (const namespaceObject of namespaces.items ?? []) {
        const namespace = namespaceObject.metadata?.name;
        if (typeof namespace !== "string" || !namespace.startsWith("oce-")) continue;
        await ensureSecret(namespace, source);
        const serviceAccounts = await request(`/api/v1/namespaces/${encodeURIComponent(namespace)}/serviceaccounts`);
        for (const account of serviceAccounts.items ?? []) {
          if (account.metadata?.labels?.["app.kubernetes.io/managed-by"] !== "openclaw-enterprise") continue;
          await ensureImagePullSecret(
            `/api/v1/namespaces/${encodeURIComponent(namespace)}/serviceaccounts/${encodeURIComponent(account.metadata.name)}`,
            account.imagePullSecrets,
          );
        }
        const deployments = await request(`/apis/apps/v1/namespaces/${encodeURIComponent(namespace)}/deployments`);
        for (const deployment of deployments.items ?? []) {
          if (deployment.metadata?.labels?.["app.kubernetes.io/managed-by"] !== "openclaw-enterprise") continue;
          const current = deployment.spec?.template?.spec?.imagePullSecrets;
          const names = (current ?? []).map((entry) => entry?.name).filter(Boolean);
          if (names.includes(secretName)) continue;
          await request(`/apis/apps/v1/namespaces/${encodeURIComponent(namespace)}/deployments/${encodeURIComponent(deployment.metadata.name)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/merge-patch+json" },
            body: JSON.stringify({ spec: { template: { spec: { imagePullSecrets: [...names.map((name) => ({ name })), { name: secretName }] } } } }),
          });
        }
      }
    }

    for (;;) {
      try {
        await synchronize();
      } catch (error) {
        console.error(error?.stack ?? error);
      }
      await sleep(2000);
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-enterprise-registry-sync
  labels:
    {{- include "oce.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oce.selector" . | nindent 6 }}
      app.kubernetes.io/component: registry-sync
  template:
    metadata:
      labels:
        {{- include "oce.selector" . | nindent 8 }}
        app.kubernetes.io/component: registry-sync
    spec:
      serviceAccountName: openclaw-enterprise-worker
      securityContext:
        {{- include "oce.podSecurity" . | nindent 8 }}
      containers:
        - name: registry-sync
          image: {{ .Values.images.controller | quote }}
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/openclaw/registry-sync.mjs"]
          env:
            - name: SOURCE_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: IMAGE_PULL_SECRET, value: {{ .Values.imagePullSecret.name | quote }}}
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
          securityContext:
            {{- include "oce.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: script, mountPath: /opt/openclaw, readOnly: true}
      volumes:
        - name: script
          configMap:
            name: openclaw-enterprise-registry-sync
            defaultMode: 0444
