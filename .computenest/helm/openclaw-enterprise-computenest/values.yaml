images:
  controller: ""
  runtime: ""
  runtimeDigest: "sha256:7a668e42508a6453c7f17071172c5314f64e0a87b6a1c202e5b73025b1fa65ff"
  postgres: ""

adminEmail: admin@example.com
installationName: OpenClaw Enterprise on ComputeNest
authSecret: change-me-to-at-least-32-characters
databasePassword: change-me
applicationDatabasePassword: change-me
migrationDatabasePassword: change-me

# Console access address, also used as OCC_AUTH_BASE_URL (the only trusted sign-in origin).
# mode: ip (load balancer address) | domain (custom domain resolved to the load balancer) | sslip
# protocol: https (self-signed certificate) | http (plain text, no certificate warning)
endpoint:
  mode: ip
  domain: ""
  protocol: https

service:
  type: LoadBalancer
  annotations: {}
  # Defaults to 80 for http and 443 for https.
  port: ""

imagePullSecret:
  name: computenest-acr
  dockerConfigJson: ""

storage:
  className: alicloud-disk-topology-alltype
  postgresSize: 40Gi
  bootstrapSize: 20Gi
  # 上游为每个 Agent gateway 固定申请 10Gi 卷，低于 ESSD 的 20GiB 下限；
  # 单独提供支持小容量的 ESSD AutoPL / ESSD Entry 存储类。
  gateway:
    className: openclaw-enterprise-gateway
    diskTypes: cloud_auto,cloud_essd_entry,cloud_essd

resources:
  controller:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  postgres:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  runtime:
    gateway:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 2Gi}
    agent:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 4Gi}

worker:
  pollIntervalMs: 250
  leaseDurationMs: 5000
  maxAttempts: 5
  convergenceTimeoutMs: 900000
